name: CI

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    check:
        name: Lint, format, test, build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: '20'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Check formatting
              run: pnpm fmt:check

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build
