name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write
    pull-requests: read

jobs:
    publish:
        name: Publish to npm
        runs-on: ubuntu-latest
        environment: npm
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: pnpm
                  registry-url: 'https://registry.npmjs.org'

            - name: Check tag matches package.json version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
                      echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
                      exit 1
                  fi

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Check formatting
              run: pnpm fmt:check

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build

            - name: Publish
              run: npm publish

    homebrew:
        name: Update Homebrew tap
        needs: publish
        runs-on: ubuntu-latest
        permissions: {}
        steps:
            - name: Checkout tap
              uses: actions/checkout@v6
              with:
                  repository: tahayvr/homebrew-tap
                  token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

            - name: Update formula
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  URL="https://registry.npmjs.org/zedx/-/zedx-$VERSION.tgz"

                  # The tarball can take a moment to appear after publishing
                  for i in 1 2 3 4 5 6; do
                      curl -sfL "$URL" -o zedx.tgz && break
                      echo "Tarball not available yet, retrying in 10s"
                      sleep 10
                  done
                  [ -f zedx.tgz ] || { echo "Could not download $URL"; exit 1; }

                  SHA=$(sha256sum zedx.tgz | awk '{print $1}')
                  rm zedx.tgz

                  sed -i "s/version '[^']*'/version '$VERSION'/" zedx.rb
                  sed -i "s|url '[^']*'|url '$URL'|" zedx.rb
                  sed -i "s/sha256 '[^']*'/sha256 '$SHA'/" zedx.rb

                  echo "Updated zedx.rb to $VERSION ($SHA)"

            - name: Commit and push
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add zedx.rb
                  if git diff --cached --quiet; then
                      echo "Formula already up to date"
                      exit 0
                  fi
                  git commit -m "zedx ${GITHUB_REF_NAME#v}"
                  git push

    release:
        name: Create release
        needs: publish
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Generate changelog
              uses: orhun/git-cliff-action@v4
              id: git-cliff
              with:
                  config: cliff.toml
                  args: -vv --latest --strip header
              env:
                  OUTPUT: CHANGELOG.md
                  GITHUB_REPO: ${{ github.repository }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Create GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  body: ${{ steps.git-cliff.outputs.content }}
                  tag_name: ${{ github.ref_name }}
